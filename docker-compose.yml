version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ledgerline-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ledgerline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: ledgerline-api
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0

volumes:
  mongo_data:
  redis_data:
